# The MCP catalog as 5.10 ships it.
#
# Seeded once into ohrm_mcp_api_permission. Nothing reads this file at runtime;
# the screen and tools/list read the columns it populates.
#
# apis        one entry per API class the product ships a row for. Being listed
#             here is what creates the row.
#
#   label       what an administrator sees. Mostly the class name made
#               readable; the rest are written out because the class name
#               describes the route rather than the thing -- "Employee Allowed
#               Skill" is what the endpoint is called, while what it does is
#               list the skills you may pick from. Editable afterwards, and an
#               upgrade leaves an edited one alone.
#
#   sensitivity 0 for ordinary data, 10 for the endpoints whose name does not
#               announce what they hold. Spaced deliberately: a level between
#               the two lands at 5 without renumbering anything. An upgrade
#               rewrites this, because a warning a tenant can quietly downgrade
#               is not a warning.
#
#   read        present and true on the classes whose reads ship switched on.
#               Absent means off, which is also the only setting any write ever
#               ships with. This is a starting point, not a floor or a ceiling:
#               once an administrator saves the screen their choices are the
#               only thing that counts, and upgrades do not revisit them.
#
# notSeeded   routable classes the product deliberately ships no row for:
#             validation oracles, UI scaffolding, environment metadata, file
#             plumbing, administrative configuration and the Buzz module.
#             Nothing blocks them -- inserting a row makes one work -- they are
#             simply not what the product hands an administrator to start from.
#             Listed so the tests can prove every routable class is accounted
#             for as either shipped or deliberately not.

