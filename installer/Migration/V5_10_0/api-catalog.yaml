# The MCP catalog as 5.10 ships it: what each API is called, and how sensitive
# the data behind it is.
#
# Seeded once into ohrm_mcp_api_permission. Nothing reads this file at runtime;
# the screen and tools/list read the columns it populates.
#
# label       what an administrator sees. Mostly the class name made readable;
#             the rest are written out because the class name describes the
#             route rather than the thing -- "Employee Allowed Skill" is what
#             the endpoint is called, while what it does is list the skills you
#             may pick from. Editable afterwards, and an upgrade leaves an
#             edited one alone.
#
# sensitivity 0 for ordinary data, 10 for the endpoints whose name does not
#             announce what they hold. Deliberately spaced: a level between the
#             two lands at 5 without renumbering anything. An upgrade rewrites
#             this, because a warning a tenant can quietly downgrade is not a
#             warning.
