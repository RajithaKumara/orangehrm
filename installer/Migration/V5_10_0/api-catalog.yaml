  # Read ships off, and not because of who may see the data. A candidate's
  # `comment` and `keywords` are written by the applicant: ApplicantController
  # is a PublicControllerInterface on the unauthenticated route
  # /recruitment/public/applicants and writes both straight from the request
  # body. CandidateDetailedModel then hands them to whatever reads this
  # endpoint. Turning it on means every assistant listing candidates reads text
  # composed by someone outside the company, which is the one source of
  # instructions an attacker can place in front of a model without any access
  # at all. Buzz was excluded for a weaker version of this, where the author is
  # at least an employee. An administrator can still enable it deliberately.
