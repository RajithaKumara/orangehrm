apiv2_admin_mcp_config:
  description: 'API-v2 Admin - MCP Configuration'
  api: OrangeHRM\Mcp\Api\McpConfigAPI
  module: admin
  allowed:
    read: true
    create: false
    update: true
    delete: false
  permissions:
    - { role: Admin, permission: { read: true, create: false, update: true, delete: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }
