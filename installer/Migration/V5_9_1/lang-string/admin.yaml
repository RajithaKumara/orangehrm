langStrings:
  -
    value: 'Require Verified Email'
    unitId: require_verified_email
  -
    value: 'When a user signs in to OrangeHRM with this provider, allow it only if the provider confirms that the user''s email address is verified (email_verified claim)'
    unitId: require_verified_email_hint
    note: 'Keep email_verified as it is: it is the name of an OpenID Connect claim'
  -
    value: 'Require Matching User ID'
    unitId: require_matching_user_id
  -
    value: 'When a user signs in to OrangeHRM with this provider, allow it only if the user ID in the ID token matches the user ID in the UserInfo response (sub claim)'
    unitId: require_matching_user_id_hint
    note: 'Keep ID token, UserInfo and sub as they are: they are OpenID Connect terms'
